- name: create ec2 instances and route53 records
  hosts: local
  connection: local
  vars: 
   instances: [ "mongodb", "redis", "catalogue", "user", "cart", "shipping", "payment", "frontend" ]
   action: create
   domain_name: cargogreen.si
   ami_id: ami-0055977a6e828a4f4
  tasks:
  - name: create ec2 instances
    amazon.aws.ec2_instance: 
      name: "roboshop-{{ item }}"
      image_id: "{{ ami_id }}"
      instance_type: t3.micro
      vpc_subnet_id: subnet-0377bddd95e2601f2
      security_groups: 
       - roboshop-common
       - roboshop-{{ item }}
      region: us-east-1

    loop: "{{ instances }}"
    when: action == "create"
    register: ec2_output
  - name: print ec2 creation output
    debug:
      msg: "{{ ec2_output }}"

  - name: create route53 records
    amazon.aws.route53:
     state: present
     zone: "{{ domain_name }}"
     record: "{{ item.item }}.{{ domain_name }}"
     type: A
     ttl: 300
     value: "{{ item.instances[0].private_ip_address }}"
     overwrite: true
    loop: "{{ ec2_output.results }}"
    when: action == "create"
  
  - name: delete route53 records
    amazon.aws.route53:
     state: absent
     zone: "{{ domain_name }}"
     record: "{{ item }}.{{ domain_name }}"
     ttl: 300
     type: A
    loop: "{{ instances
    when: action == "delete"
  
  - name: terminate ec2 instances
    amazon.aws.ec2_instance:
      state: absent
      name: "roboshop-{{ item }}"
      region: us-east-1
      wait: false
    loop: "{{ instances }}"
    when: action == "delete"