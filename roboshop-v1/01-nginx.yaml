- name: install and start ngin
  hosts: frontend
  become: true
  tasks:
    - name: install nginx
      ansible.builtin.dnf:
        name: nginx
        state: present
    - name: start nginx
      ansible.builtin.service:
        name: nginx
        state: started
    - name: enable nginx
      ansible.builtin.service:
        name: nginx
        enabled: true