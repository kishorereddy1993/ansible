- name: print os type red hat or debian
  hosts: local
  connection: local
  tasks:
    - name: print os type
      ansible.builtin.debug:
        msg: "Os disrto is redhat"
      when: ansible_facts['os_family'] == "RedHat"
    - name: print os type
      ansible.builtin.debug:
        msg: "Os disrto is debian"
      when: ansible_facts['os_family'] == "Debian"  

