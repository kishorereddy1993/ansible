- name: course info
  hosts: local
  connection: local
  vars:
    course_name: Ansible
    course_duration: 3 days
    course_level: Beginner to Advanced
  tasks:
    - name: print course info
      ansible.builtin.debug:
        msg: 
          - "Course Name: {{ course_name }}"
          - "Course Duration: {{ course_duration }}"
          - "Course Level: {{ course_level }}"